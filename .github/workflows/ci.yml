name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests-linux:
    name: Core tests (Linux)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test

  macos-build:
    name: Build app (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Core unit tests
        run: swift test
      - name: Build app
        run: |
          xcodebuild \
            -project AmbientScreenIntelligence.xcodeproj \
            -scheme AmbientScreenIntelligence \
            -configuration Debug \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            build
